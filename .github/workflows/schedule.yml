name: Weekly Competitor Copy Scraper

on:
  schedule:
    # UTC 기준 00:00 = 한국 시간(KST) 오전 09:00
    # 매주 월요일(1), 목요일(4) 실행
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # 수동 테스트 실행 가능하도록 설정

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: 크롤러 스크립트 실행
        run: python crawler.py
